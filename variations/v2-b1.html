<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 — B1 flow: framing → recommendation → scope → confirm</title>
<style>
    /* Tokens and shell lifted from smp.html / treatments.html so this reads as
       the same product rather than a separate sketch. */
    :root {
        --bg-surface: #ffffff;
        --bg-offset: #f5f6f8;
        --text-default: #353a44;
        --text-subdued: #596171;
        --text-heading: #21252c;
        --text-muted: #99a5b8;
        --text-action-primary: #533afd;
        --icon-action-primary: #675dff;
        --border-action-primary-strong: #533afd;
        --border-default: #d4dee9;
        --bg-form-accent: #675dff;
        --neutral-200: #b6c0cd;
        --neutral-50: #ebeef1;
        --shadow-overlay: 0px 15px 35px 0px rgba(48, 49, 61, 0.08), 0px 5px 15px 0px rgba(0, 0, 0, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
        background: var(--bg-offset); overflow: hidden; height: 100vh; width: 100vw;
    }

    /* ---------- dashboard shell ---------- */
    .dashboard { display: flex; height: 100vh; width: 100vw; }
    .sidebar {
        width: 240px; background: var(--bg-surface); border-right: 1px solid var(--neutral-50);
        padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-logo { padding: 8px 12px; margin-bottom: 20px; }
    .nav-item { padding: 8px 12px; border-radius: 6px; font-size: 14px; color: var(--text-subdued); }
    .nav-item.active { background: var(--bg-offset); color: var(--text-default); font-weight: 500; }
    .main-content { flex: 1; background: var(--bg-offset); padding: 32px; }
    .content-placeholder { height: 200px; background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--neutral-50); }

    /* ---------- modal ---------- */
    .modal-backdrop {
        position: fixed; inset: 0; background: rgba(182, 192, 205, 0.7);
        display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
        width: 90%; height: 90%; max-width: 1180px; background: var(--bg-surface);
        border-radius: 12px; box-shadow: var(--shadow-overlay);
        display: flex; flex-direction: column; overflow: hidden; position: relative; padding: 16px;
    }
    .modal-gradient {
        position: absolute; inset: 16px; border-radius: 8px; z-index: 0;
        background:
            radial-gradient(52% 70% at 46% 70%, rgba(207, 226, 255, 0.24) 0%, rgba(207, 226, 255, 0) 94%),
            radial-gradient(105% 45% at 93% 37%, rgba(216, 128, 236, 0.26) 0%, rgba(216, 128, 236, 0) 79%),
            radial-gradient(60% 46% at 105% 72%, rgba(254, 180, 203, 0.42) 0%, rgba(254, 180, 203, 0) 103%),
            #fefefe;
    }
    .modal-header, .modal-body, .modal-footer { position: relative; z-index: 1; }
    .modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 28px 56px 0; flex-shrink: 0;
    }
    .stripe-logo svg { width: 64px; height: 26px; }
    .progress-bar { width: 125px; height: 5px; background: var(--bg-offset); border-radius: 100px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--icon-action-primary); border-radius: 100px; transition: width 0.4s ease; }

    .modal-body {
        flex: 1; min-height: 0; overflow-y: auto; padding: 32px 56px 8px;
        display: flex; flex-direction: column; justify-content: center;
    }
    .modal-body > .inner { width: 100%; max-width: 860px; margin: 0 auto; }
    .modal-footer {
        flex-shrink: 0; padding: 16px 56px 24px; display: flex; align-items: center;
        justify-content: space-between; gap: 16px;
    }

    /* ---------- type ---------- */
    .step-eyebrow {
        font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        color: var(--text-muted); margin-bottom: 10px;
    }
    h1.headline {
        font-size: 26px; line-height: 33px; font-weight: 600; letter-spacing: -0.5px;
        color: var(--text-heading); margin-bottom: 12px;
    }
    h1.headline .muted { color: var(--text-muted); font-weight: 600; }
    /* The anchor copy. Rendered as one block, verbatim, never split across
       screens — the reassurance only works if the condition travels with it. */
    .anchor-copy {
        font-size: 15px; line-height: 23px; color: var(--text-subdued);
        letter-spacing: -0.15px; max-width: 640px; margin-bottom: 24px;
    }
    .anchor-copy strong { color: var(--text-default); font-weight: 600; }

    /* ---------- buttons ---------- */
    .btn {
        font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.15px;
        padding: 9px 16px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
        transition: filter 0.15s, background 0.15s;
    }
    .btn-primary { background: var(--bg-form-accent); color: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.12); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary { background: var(--bg-surface); border-color: var(--border-default); color: var(--text-default); }
    .btn-secondary:hover { background: var(--bg-offset); }
    .btn-ghost {
        background: none; border: none; color: var(--text-subdued); font-family: inherit;
        font-size: 14px; cursor: pointer; padding: 9px 4px;
    }
    .btn-ghost:hover { color: var(--text-default); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---------- 1B: collapsible trigger list ---------- */
    .trig-list { display: flex; flex-direction: column; gap: 8px; }
    .trig {
        background: rgba(255,255,255,0.74); border: 1px solid var(--border-default);
        border-radius: 8px; padding: 12px 14px; animation: fade-up 0.3s ease both;
    }
    .trig-head {
        display: flex; align-items: baseline; gap: 12px; cursor: pointer;
        font-size: 14px; line-height: 20px; color: var(--text-default);
    }
    .trig-when {
        flex-shrink: 0; width: 132px; font-size: 12px; font-weight: 600;
        color: var(--text-action-primary);
    }
    .trig-what { flex: 1; font-weight: 500; }
    /* Who handles it is stated on the collapsed row. The whole argument of the
       framing step is the right-hand column always saying "Stripe". */
    .trig-owner {
        flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
        background: #efecfc; border: 1px solid #c3b6fb; color: #44139f;
    }
    .trig-toggle {
        flex-shrink: 0; background: none; border: none; font-family: inherit; padding: 0;
        font-size: 16px; line-height: 1; color: var(--text-muted); cursor: pointer; width: 14px;
    }
    .trig-detail {
        display: none; font-size: 13px; line-height: 19px; color: var(--text-subdued);
        padding: 10px 0 0 144px;
    }
    .trig.open .trig-detail { display: block; }
    .trig.open .trig-toggle { color: var(--text-action-primary); }
    @keyframes fade-up { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    /* ---------- 2: comparison columns ---------- */
    .cmp { display: flex; gap: 16px; align-items: stretch; }
    .col {
        flex: 1; min-width: 0; background: var(--bg-surface); border: 2px solid var(--border-default);
        border-radius: 10px; padding: 18px; cursor: pointer; display: flex; flex-direction: column;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .col:hover { border-color: var(--neutral-200); }
    .col.selected { border-color: var(--border-action-primary-strong); box-shadow: 0 0 0 1px var(--border-action-primary-strong); }
    /* 2B asymmetry: the recommendation gets visual primacy, the alternative
       stays complete and correctly priced. Recommended, not only. */
    .cmp.asym .col.rec { flex: 1.25; }
    .cmp.asym .col.alt { background: rgba(255,255,255,0.6); }
    .col-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .col-title { font-size: 15px; font-weight: 600; color: var(--text-heading); }
    .col-sub { font-size: 13px; line-height: 18px; color: var(--text-subdued); margin-bottom: 14px; }
    .tag-rec {
        display: inline-flex; align-items: center; padding: 2px 9px; background: var(--icon-action-primary);
        border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; letter-spacing: 0.2px;
    }
    .tag-neutral {
        display: inline-flex; align-items: center; padding: 2px 9px; background: var(--bg-offset);
        border: 1px solid var(--border-default); border-radius: 4px; font-size: 11px;
        font-weight: 600; color: var(--text-subdued); letter-spacing: 0.2px;
    }
    /* Price block is always rendered, never behind a disclosure. "Don't worry
       about it now" is only honest if the number is unavoidable here. */
    .price-block {
        padding: 12px 14px; background: var(--bg-offset); border-radius: 8px; margin-bottom: 14px;
    }
    .price-main {
        font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-heading);
        font-variant-numeric: tabular-nums;
    }
    .price-rows { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .price-row {
        display: flex; justify-content: space-between; gap: 10px;
        font-size: 12px; line-height: 17px; color: var(--text-subdued);
    }
    .price-row b { color: var(--text-default); font-weight: 600; font-variant-numeric: tabular-nums; }
    .price-note { font-size: 11px; line-height: 15px; color: var(--text-muted); margin-top: 8px; }
    .feat-list { display: flex; flex-direction: column; gap: 9px; margin-top: auto; }
    .feat { display: flex; gap: 8px; font-size: 13px; line-height: 19px; color: var(--text-default); }
    .feat .ic { width: 13px; height: 13px; flex-shrink: 0; margin-top: 3px; }
    .feat.off { color: var(--text-muted); }
    .feat-head {
        font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
        color: var(--text-muted); margin: 4px 0 2px;
    }

    /* recommendation banner (2A) */
    .rec-banner {
        display: flex; gap: 12px; padding: 14px 16px; background: rgba(255,255,255,0.8);
        border: 1px solid var(--border-default); border-left: 3px solid var(--icon-action-primary);
        border-radius: 8px; margin-bottom: 18px;
    }
    .rec-banner .rb-title { font-size: 14px; font-weight: 600; color: var(--text-heading); margin-bottom: 3px; }
    .rec-banner .rb-body { font-size: 13px; line-height: 19px; color: var(--text-subdued); }

    /* 2C: workload diff */
    .diff { display: flex; flex-direction: column; gap: 2px; }
    .diff-row {
        display: flex; align-items: center; gap: 12px; padding: 11px 0;
        border-top: 1px solid var(--neutral-50); font-size: 13px; line-height: 18px;
    }
    .diff-row:first-child { border-top: none; }
    .diff-what { flex: 1; color: var(--text-default); font-weight: 500; }
    .diff-cell { width: 190px; flex-shrink: 0; }
    .owner {
        display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 4px;
        font-size: 12px; line-height: 16px; font-weight: 500;
    }
    /* Both owners carry the same weight. "You do it" is a real answer, not a
       warning state — only the hue differs. */
    .owner.you { background: #fdf3e7; border: 1px solid #f3d9b0; color: #8a5a11; }
    .owner.stripe { background: #efecfc; border: 1px solid #c3b6fb; color: #44139f; }
    .diff-headrow {
        display: flex; gap: 12px; padding-bottom: 8px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted);
    }

    /* ---------- 3A: volume bar ---------- */
    .scope-card {
        background: var(--bg-surface); border: 2px solid var(--border-default); border-radius: 10px;
        padding: 18px; display: flex; flex-direction: column; gap: 16px;
    }
    .vol-bar { height: 42px; display: flex; border-radius: 7px; overflow: hidden; background: var(--bg-offset); }
    .vol-seg {
        display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
        font-size: 11px; font-weight: 600; white-space: nowrap; padding: 0 8px;
        transition: background 0.42s cubic-bezier(0.2,0.8,0.2,1), color 0.42s ease;
    }
    .vol-seg.dom { flex: 0 0 68%; background: #c3cbd6; color: var(--text-heading); }
    .vol-seg.dom.covered { background: #675dff; color: #fff; }
    .vol-seg.intl { flex: 0 0 32%; background: #675dff; color: #fff; }
    .vol-legend { display: flex; gap: 18px; font-size: 12px; color: var(--text-subdued); flex-wrap: wrap; }
    .vol-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
    .vol-caption { font-size: 11px; line-height: 15px; color: var(--text-muted); }

    .scope-opts { display: flex; flex-direction: column; gap: 10px; }
    .scope-opt {
        display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px;
        border: 2px solid var(--border-default); border-radius: 8px; cursor: pointer;
        background: var(--bg-surface); transition: border-color 0.15s;
    }
    .scope-opt.selected { border-color: var(--border-action-primary-strong); }
    .radio {
        width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--neutral-200);
        flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
        background: var(--bg-surface);
    }
    .scope-opt.selected .radio { border-color: var(--bg-form-accent); border-width: 5px; }
    .scope-body { flex: 1; }
    .scope-title {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        font-size: 14px; font-weight: 600; color: var(--text-default);
    }
    .scope-rate { font-size: 13px; font-weight: 600; color: var(--text-heading); font-variant-numeric: tabular-nums; }
    .scope-desc { font-size: 12px; line-height: 17px; color: var(--text-subdued); margin-top: 4px; }
    /* The domestic rate change is volunteered, not disclosed on request. This
       callout is the screen retiring the "only costs you on global sales" claim. */
    .scope-change {
        display: flex; gap: 9px; margin-top: 8px; padding: 9px 11px; border-radius: 6px;
        background: #fdf3e7; border: 1px solid #f3d9b0;
        font-size: 12px; line-height: 17px; color: #7a4f0f;
    }
    .scope-change b { font-weight: 700; }
    .rate-strip {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding: 11px 13px; background: var(--bg-offset); border-radius: 7px;
    }
    .rate-strip .label { font-size: 12px; color: var(--text-subdued); }
    .rate-strip .value {
        font-size: 18px; font-weight: 700; color: var(--text-heading);
        letter-spacing: -0.2px; font-variant-numeric: tabular-nums;
    }

    /* ---------- 4: confirm ---------- */
    .sum-card {
        background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 10px;
        padding: 18px; margin-bottom: 14px;
    }
    .sum-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--neutral-50);
    }
    .sum-title { font-size: 15px; font-weight: 600; color: var(--text-heading); }
    .sum-rows { display: flex; flex-direction: column; gap: 9px; }
    .sum-row { display: flex; gap: 12px; font-size: 13px; line-height: 19px; }
    .sum-row .k { width: 190px; flex-shrink: 0; color: var(--text-subdued); }
    .sum-row .v { flex: 1; color: var(--text-default); }
    .sum-row .v b { font-weight: 600; font-variant-numeric: tabular-nums; }
    /* The payoff of the anchor copy: the confirmation says, in numbers, that
       nothing is owed today. */
    .today-note {
        display: flex; gap: 9px; padding: 11px 13px; border-radius: 7px;
        background: #edf7ee; border: 1px solid #b9e0bd; color: #1c5e26;
        font-size: 13px; line-height: 19px; margin-top: 14px;
    }
    .alc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .alc {
        display: flex; gap: 10px; align-items: baseline; padding: 10px 12px;
        background: rgba(255,255,255,0.7); border: 1px solid var(--border-default); border-radius: 7px;
        font-size: 13px; line-height: 18px;
    }
    .alc-name { font-weight: 600; color: var(--text-default); width: 132px; flex-shrink: 0; }
    .alc-desc { color: var(--text-subdued); flex: 1; }
    .todo-flag {
        font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
        color: #8a5a11; background: #fdf3e7; border: 1px solid #f3d9b0;
        padding: 1px 6px; border-radius: 3px; margin-left: 8px;
    }
    .reversible { font-size: 13px; line-height: 19px; color: var(--text-subdued); margin-top: 14px; }

    /* ---------- glossary term ---------- */
    .term { position: relative; border-bottom: 1px dotted var(--neutral-200); cursor: help; }
    .term-pop {
        position: absolute; bottom: calc(100% + 8px); left: -8px; width: 300px; padding: 14px;
        background: var(--bg-surface); border: 1px solid #d4dee9; border-radius: 8px;
        box-shadow: 0px 3px 4.5px rgba(64,68,82,0.12); font-size: 13px; line-height: 19px;
        color: #1a2c44; text-align: left; opacity: 0; visibility: hidden;
        transition: opacity 0.15s; z-index: 60; font-weight: 400;
    }
    .term:hover .term-pop { opacity: 1; visibility: visible; }

    /* ---------- control panel ---------- */
    .control-panel {
        position: fixed; bottom: 16px; left: 16px; z-index: 500; width: 296px;
        padding: 14px; background: var(--bg-surface); border-radius: 12px;
        border: 1px solid var(--neutral-50); box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        font-size: 12px; max-height: calc(100vh - 32px); overflow-y: auto;
    }
    .cp-title {
        font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        color: var(--text-muted); margin-bottom: 10px;
    }
    .cp-group { margin-bottom: 12px; }
    .cp-label { font-size: 11px; font-weight: 600; color: var(--text-subdued); margin-bottom: 5px; }
    .cp-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .cp-btn {
        font-family: inherit; font-size: 11px; padding: 4px 9px; border-radius: 5px;
        border: 1px solid var(--border-default); background: var(--bg-surface);
        color: var(--text-subdued); cursor: pointer;
    }
    .cp-btn.on { background: var(--bg-form-accent); border-color: var(--bg-form-accent); color: #fff; font-weight: 600; }
    .cp-btn.instr { border-style: dashed; }
    .cp-note {
        font-size: 11px; line-height: 16px; color: var(--text-muted);
        border-top: 1px solid var(--neutral-50); padding-top: 10px;
    }
    .cp-note b { color: var(--text-subdued); }
</style>
</head>

<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-logo">

        </div>
        <div class="nav-item">Home</div>
        <div class="nav-item">Balances</div>
        <div class="nav-item">Transactions</div>
        <div class="nav-item active">Get started</div>
        <div class="nav-item">Products</div>
        <div class="nav-item">Reports</div>

<div class="modal-backdrop">
    <div class="modal">
        <div class="modal-gradient"></div>
        <div class="modal-header">
            <div class="stripe-logo">
                <svg viewBox="0 0 60 25" fill="#0a2540"><path d="M59.64 14.28h-8.06c.19 1.93 1.6 2.55 3.2 2.55 1.64 0 2.96-.37 4.05-.95v3.32a8.33 8.33 0 0 1-4.56 1.1c-4.01 0-6.83-2.5-6.83-7.48 0-4.19 2.39-7.52 6.3-7.52 3.92 0 5.96 3.28 5.96 7.5 0 .4-.04 1.26-.06 1.48zm-5.92-5.62c-1.03 0-2.17.73-2.17 2.58h4.25c0-1.85-1.07-2.58-2.08-2.58zM40.95 20.3c-1.44 0-2.32-.6-2.9-1.04l-.02 4.63-4.12.87V5.57h3.76l.08 1.02a4.7 4.7 0 0 1 3.23-1.29c2.9 0 5.62 2.6 5.62 7.4 0 5.23-2.7 7.6-5.65 7.6zM40 8.95c-.95 0-1.54.34-1.97.81l.02 6.12c.4.44.98.78 1.95.78 1.52 0 2.54-1.65 2.54-3.87 0-2.15-1.04-3.84-2.54-3.84zM28.24 5.57h4.13v14.44h-4.13V5.57zm0-4.7L32.37 0v3.36l-4.13.88V.88zm-4.32 9.35v9.79H19.8V5.57h3.7l.12 1.22c1-1.77 3.07-1.41 3.62-1.22v3.79c-.52-.17-2.29-.43-3.32.86zm-8.55 4.72c0 2.43 2.6 1.68 3.12 1.46v3.36c-.55.3-1.54.54-2.89.54a4.15 4.15 0 0 1-4.27-4.24l.01-13.17 4.02-.86v3.54h3.13V9.1h-3.12v5.85zm-4.91.7c0 2.97-2.31 4.66-5.73 4.66a11.2 11.2 0 0 1-4.46-.93v-3.93c1.38.75 3.1 1.31 4.46 1.31.92 0 1.53-.24 1.53-1C4.26 14.37 0 15.15 0 9.85c0-2.92 2.24-4.66 5.58-4.66 1.24 0 2.5.2 3.73.7v3.88a8.35 8.35 0 0 0-3.73-.96c-.86 0-1.4.25-1.4.9 0 1.85 4.28.97 4.28 6.02z"/></svg>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        </div>
        <div class="modal-body"><div class="inner" id="stage"></div></div>
        <div class="modal-footer" id="footer"></div>
    </div>
</div>

<div class="control-panel">
    <div class="cp-title">B1 flow — treatments</div>
    <div class="cp-group">
        <div class="cp-label">Step</div>
        <div class="cp-btns" id="cpStep"></div>
    </div>
    <div class="cp-group">
        <div class="cp-label">1 — Framing</div>
        <div class="cp-btns" id="cpT1"></div>
    </div>
    <div class="cp-group">
        <div class="cp-label">2 — Recommendation</div>
        <div class="cp-btns" id="cpT2"></div>
    </div>
    <div class="cp-group">
        <div class="cp-label">3 — Scope</div>
        <div class="cp-btns" id="cpT3"></div>
    </div>
    <div class="cp-note" id="cpNote"></div>
</div>

<script>
/* ------------------------------------------------------------------
   Pricing. Unchanged from the existing prototype, per the Aug 27
   decision to keep the Vercel model rather than wait on new numbers.
------------------------------------------------------------------ */
const RATE = { dom: 2.9, intl: 3.4, smp: 3.5 };
// Illustrative volume split, labelled as such wherever it's shown. The bar is
// making a point about proportion, not reporting the merchant's actual mix.
const MIX = { dom: 68, intl: 32 };

const pct = n => n.toFixed(1) + '%';
const domRate  = scope => scope === 'all' ? RATE.dom + RATE.smp : RATE.dom;
const intlRate = ()    => RATE.intl + RATE.smp;
const effRate  = scope =>
    (MIX.dom / 100) * domRate(scope) + (MIX.intl / 100) * intlRate();

const STATE = { step: 1, t1: '1B', t2: '2B', t3: '3A', choice: null, scope: 'crossborder' };

// Deep links so the index can point at a specific step or treatment:
// ?s=2&t2=2C. Keeps every entry point inside one file.
(function readParams() {
    const q = new URLSearchParams(location.search);
    const s = parseInt(q.get('s'), 10);
    if (s >= 1 && s <= 4) STATE.step = s;
    ['t1', 't2', 't3'].forEach(k => { if (q.get(k)) STATE[k] = q.get(k); });
    // Landing directly on step 3 or 4 implies the SMP branch was chosen.
    if (STATE.step >= 3) STATE.choice = q.get('choice') === 'self' ? 'self' : 'smp';
    if (q.get('scope') === 'all') STATE.scope = 'all';
})();

const CHECK = '<svg class="ic" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6.4 4.6 9 10 3.2"/></svg>';
const DASH  = '<svg class="ic" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 6h7"/></svg>';

const term = (word, def) =>
    '<span class="term">' + word + '<span class="term-pop">' + def + '</span></span>';

const MOR = term('merchant of record',
    '<b>Merchant of record.</b> The business that legally sells to your customer and is ' +
    'responsible for tax, compliance, and disputes on that sale. With Managed Payments, ' +
    'Stripe takes that role for the volume it covers — which is how it can handle these ' +
    'obligations on your behalf rather than just advising you on them.');

/* ---- The anchor copy, verbatim. Single source so no screen can drift. ---- */
const ANCHOR =
    'These are the things you&rsquo;ll need as your business grows. Stripe will manage them ' +
    'for you as they come up (e.g. disputes, hitting tax thresholds). It only costs you when ' +
    'you start having global sales, so don&rsquo;t worry about it now if you&rsquo;re not there ' +
    'yet or don&rsquo;t know where your customers will come from.';

/* ==================================================================
   STEP 1 — Framing
================================================================== */
const TRIGGERS = [
    ['First sale abroad', 'Local payment methods and currency',
     'Customers in most markets expect to pay with the methods they already use, priced in ' +
     'their own currency. Without that, they abandon checkout.'],
    ['As disputes arrive', 'Chargebacks under local rules',
     'Dispute windows, evidence requirements, and deadlines differ by market and card network. ' +
     'Each one is a response on a clock.'],
    ['At certain sales levels', 'Hitting tax thresholds',
     'Most countries require you to register, collect, and remit local sales tax or VAT once ' +
     'you pass a revenue threshold there. The threshold is different in every market, and ' +
     'crossing it is retroactive in some.'],
    ['To process locally', 'Local banking and entity requirements',
     'Processing in a market often means a local entity or banking relationship. It also ' +
     'lifts authorization rates, because issuers approve domestic transactions more often ' +
     'than cross-border ones.'],
    ['Continuously', 'Fraud, risk, and support across time zones',
     'Fraud patterns vary by market, and customer questions arrive in local business hours ' +
     'rather than yours.'],
];

function step1() {
    if (STATE.t1 === '1D') {
        // 1D — radical restraint. The floor: how little framing can step 2
        // survive on? Kept as the control for whether step 1 earns its space.
        return '<div class="step-eyebrow">Step 1 of 4</div>'
            + '<h1 class="headline">Selling internationally brings a few obligations. '
            + '<span class="muted">Stripe can take them on for you.</span></h1>'
            + '<p class="anchor-copy">' + ANCHOR + '</p>';
    }
    // 1B — trigger list, collapsed. Headline claim readable in five seconds;
    // depth available to anyone who wants it.
    return '<div class="step-eyebrow">Step 1 of 4</div>'
        + '<h1 class="headline">Selling internationally brings a few obligations. '
        + '<span class="muted">Stripe can take them on for you.</span></h1>'
        + '<p class="anchor-copy">' + ANCHOR + '</p>'
        + '<div class="trig-list">'
        + TRIGGERS.map((t, i) =>
            '<div class="trig" id="trig' + i + '" style="animation-delay:' + (i * 45) + 'ms">'
            + '<div class="trig-head" onclick="toggleTrig(' + i + ')">'
            + '<span class="trig-when">' + t[0] + '</span>'
            + '<span class="trig-what">' + t[1] + '</span>'
            + '<span class="trig-owner">Stripe handles it</span>'
            + '<button class="trig-toggle" aria-label="Details">+</button>'
            + '</div>'
            + '<div class="trig-detail">' + t[2] + '</div></div>').join('')
        + '</div>';
}
function toggleTrig(i) { document.getElementById('trig' + i).classList.toggle('open'); }

/* ==================================================================
   STEP 2 — Recommendation + comparison
================================================================== */
const SMP_FEATURES = [
    'Stripe becomes the ' + MOR + ' for international sales',
    'Local payment methods and currencies, handled',
    'Tax registration, collection, and remittance',
    'Disputes and chargebacks handled end to end',
    'Fraud and risk managed by Stripe',
    'Local processing, which lifts authorization rates',
];
const SELF_FEATURES = [
    ['on', 'Card processing in 135+ currencies'],
    ['on', 'Stripe Tax available to calculate what you owe'],
    ['on', 'Radar available for fraud rules'],
    ['off', 'You register and remit tax in each market'],
    ['off', 'You respond to every dispute, on local deadlines'],
    ['off', 'You set up local entities or banking for local processing'],
];
const WORKLOAD = [
    ['Local payment methods', 'you', 'stripe'],
    ['Tax registration and filing', 'you', 'stripe'],
    ['Disputes and chargebacks', 'you', 'stripe'],
    ['Fraud and risk decisions', 'you', 'stripe'],
    ['Customer support for payments', 'you', 'stripe'],
    ['Local entity and banking setup', 'you', 'stripe'],
];

// Price block. Always rendered inline on both columns — the transparency half
// of the trade the framing depends on.
function priceBlock(kind) {
    if (kind === 'smp') {
        return '<div class="price-block">'
            + '<div class="price-main">+' + pct(RATE.smp) + ' per transaction</div>'
            + '<div class="price-rows">'
            + '<div class="price-row"><span>International sales</span><b>' + pct(intlRate()) + '</b></div>'
            + '<div class="price-row"><span>Domestic sales</span><b>' + pct(RATE.dom) + '</b></div>'
            + '</div>'
            + '<div class="price-note">On top of standard processing fees. Charged only on the '
            + 'volume Managed Payments covers &mdash; so nothing until you have international sales.</div>'
            + '</div>';
    }
    return '<div class="price-block">'
        + '<div class="price-main">Standard pricing</div>'
        + '<div class="price-rows">'
        + '<div class="price-row"><span>International sales</span><b>' + pct(RATE.intl) + '</b></div>'
        + '<div class="price-row"><span>Domestic sales</span><b>' + pct(RATE.dom) + '</b></div>'
        + '</div>'
        + '<div class="price-note">No added fee. Tax, Radar, and support tooling are priced '
        + 'separately if you add them.</div>'
        + '</div>';
}

function smpColumn(cls) {
    return '<div class="col ' + cls + (STATE.choice === 'smp' ? ' selected' : '') + '" onclick="pick(\'smp\')">'
        + '<div class="col-head"><span class="col-title">Managed Payments</span>'
        + '<span class="tag-rec">Recommended</span></div>'
        + '<div class="col-sub">Stripe manages the obligations of selling internationally as they come up.</div>'
        + priceBlock('smp')
        + '<div class="feat-list">'
        + SMP_FEATURES.map(f => '<div class="feat">' + CHECK + '<span>' + f + '</span></div>').join('')
        + '</div></div>';
}
function selfColumn(cls) {
    return '<div class="col ' + cls + (STATE.choice === 'self' ? ' selected' : '') + '" onclick="pick(\'self\')">'
        + '<div class="col-head"><span class="col-title">Self-managed</span>'
        + '<span class="tag-neutral">Fully supported</span></div>'
        + '<div class="col-sub">You handle international obligations yourself, with Stripe products to help.</div>'
        + priceBlock('self')
        + '<div class="feat-list">'
        + SELF_FEATURES.map(f =>
            '<div class="feat' + (f[0] === 'off' ? ' off' : '') + '">'
            + (f[0] === 'off' ? DASH : CHECK) + '<span>' + f[1] + '</span></div>').join('')
        + '</div></div>';
}

function step2() {
    const head = '<div class="step-eyebrow">Step 2 of 4</div>';

    if (STATE.t2 === '2A') {
        // 2A — opinion in the copy, comparison symmetrical. The check on
        // whether 2B's asymmetry is doing something coercive.
        return head
            + '<h1 class="headline">Two ways to sell internationally.</h1>'
            + '<div class="rec-banner"><div><div class="rb-title">Stripe recommends Managed Payments '
            + 'for digital goods businesses.</div>'
            + '<div class="rb-body">Digital goods sell across borders from day one, which means tax '
            + 'thresholds, disputes, and local payment methods arrive early. Both options are below, '
            + 'priced. Either is fully supported.</div></div></div>'
            + '<div class="cmp">' + smpColumn('rec') + selfColumn('alt') + '</div>';
    }

    if (STATE.t2 === '2C') {
        // 2C — the workload diff. Patches the frame's known weakness: "Stripe
        // handles it" never says what the merchant would otherwise do.
        return head
            + '<h1 class="headline">The difference is who does the work. '
            + '<span class="muted">Both options priced.</span></h1>'
            + '<div class="diff-headrow"><span class="diff-what">&nbsp;</span>'
            + '<span class="diff-cell">Self-managed &middot; ' + pct(RATE.intl) + ' intl</span>'
            + '<span class="diff-cell">Managed Payments &middot; ' + pct(intlRate()) + ' intl</span></div>'
            + '<div class="diff">'
            + WORKLOAD.map(r =>
                '<div class="diff-row"><span class="diff-what">' + r[0] + '</span>'
                + '<span class="diff-cell"><span class="owner you">You</span></span>'
                + '<span class="diff-cell"><span class="owner stripe">Stripe</span></span></div>').join('')
            + '</div>'
            + '<div class="cmp" style="margin-top:20px">'
            + '<div class="col alt' + (STATE.choice === 'self' ? ' selected' : '') + '" onclick="pick(\'self\')">'
            + '<div class="col-head"><span class="col-title">Self-managed</span>'
            + '<span class="tag-neutral">Fully supported</span></div>' + priceBlock('self') + '</div>'
            + '<div class="col rec' + (STATE.choice === 'smp' ? ' selected' : '') + '" onclick="pick(\'smp\')">'
            + '<div class="col-head"><span class="col-title">Managed Payments</span>'
            + '<span class="tag-rec">Recommended</span></div>' + priceBlock('smp') + '</div>'
            + '</div>';
    }

    if (STATE.t2 === '2E') {
        // 2E — DIAGNOSTIC, NOT A CANDIDATE. Recommendation alone, comparison
        // one click away. Built to measure whether "don't worry about it now"
        // stops people opening the price. If most never expand, that's the
        // answer and the fix is to move the comparison earlier.
        const open = STATE.cmpOpen;
        return head
            + '<h1 class="headline">We recommend Managed Payments.</h1>'
            + '<p class="anchor-copy">For a digital goods business selling internationally, Stripe '
            + 'manages tax, disputes, local payment methods, and fraud as they come up. '
            + '<strong>+' + pct(RATE.smp) + ' per transaction</strong> on the volume it covers.</p>'
            + '<button class="btn btn-secondary" onclick="STATE.cmpOpen=!STATE.cmpOpen;render()">'
            + (open ? 'Hide comparison' : 'Compare with self-managed') + '</button>'
            + (open ? '<div class="cmp" style="margin-top:18px">' + smpColumn('rec') + selfColumn('alt') + '</div>' : '')
            + '<div class="vol-caption" style="margin-top:14px">Diagnostic treatment. If reviewers '
            + 'and users skip this button, &ldquo;don&rsquo;t worry about it now&rdquo; is suppressing '
            + 'the price &mdash; see narrative brief &sect;3.</div>';
    }

    // 2B — asymmetric: recommended primary, alternative complete and priced.
    // The leading candidate.
    return head
        + '<h1 class="headline">For a digital goods business, we recommend Managed Payments. '
        + '<span class="muted">Here it is next to managing it yourself.</span></h1>'
        + '<div class="cmp asym">' + smpColumn('rec') + selfColumn('alt') + '</div>';
}

function pick(c) { STATE.choice = c; render(); }

/* ==================================================================
   STEP 3 — Scope
   Also the screen that retires "it only costs you when you start having
   global sales". Extending to all volume puts +3.5% on domestic, and this
   screen volunteers that rather than waiting to be asked.
================================================================== */
function step3() {
    const head = '<div class="step-eyebrow">Step 3 of 4</div>'
        + '<h1 class="headline">How much of your volume should Managed Payments cover? '
        + '<span class="muted">You can change this later.</span></h1>';
    const all = STATE.scope === 'all';

    const opts =
        '<div class="scope-opts">'
        + '<div class="scope-opt' + (!all ? ' selected' : '') + '" onclick="setScope(\'crossborder\')">'
        + '<span class="radio"></span><div class="scope-body">'
        + '<div class="scope-title"><span>International sales only</span>'
        + '<span class="scope-rate">' + pct(intlRate()) + ' intl &middot; ' + pct(RATE.dom) + ' domestic</span></div>'
        + '<div class="scope-desc">Managed Payments covers sales outside your home market. '
        + 'Your domestic sales stay on standard pricing, exactly as they are today.</div>'
        + '</div></div>'
        + '<div class="scope-opt' + (all ? ' selected' : '') + '" onclick="setScope(\'all\')">'
        + '<span class="radio"></span><div class="scope-body">'
        + '<div class="scope-title"><span>All sales, including domestic</span>'
        + '<span class="scope-rate">' + pct(intlRate()) + ' intl &middot; ' + pct(RATE.dom + RATE.smp) + ' domestic</span></div>'
        + '<div class="scope-desc">Stripe also takes on tax, disputes, fraud, and support for your '
        + 'domestic sales &mdash; one operating model across your whole business.</div>'
        + '<div class="scope-change">'
        + '<span>&#9888;</span><span>This changes what you pay at home. Your domestic rate goes from '
        + '<b>' + pct(RATE.dom) + '</b> to <b>' + pct(RATE.dom + RATE.smp) + '</b>, and applies to sales '
        + 'you&rsquo;re already making &mdash; not only to future international ones.</span></div>'
        + '</div></div></div>';

    if (STATE.t3 === '3C') {
        // 3C — control condition. No visual. If this reads as clearly as 3A,
        // the bar isn't earning its space.
        return head + opts
            + '<div class="rate-strip" style="margin-top:16px">'
            + '<span class="label">Your blended rate on an illustrative '
            + MIX.dom + '/' + MIX.intl + ' domestic-international split</span>'
            + '<span class="value">' + pct(effRate(STATE.scope)) + '</span></div>';
    }

    if (STATE.t3 === '3B') {
        // 3B — the four-cell rate table. Most literal disclosure; risks the
        // simultaneous-evaluation problem that split steps 2 and 3.
        const cell = (v, changed) =>
            '<div class="price-row"><span>&nbsp;</span><b' + (changed ? ' style="color:#8a5a11"' : '') + '>' + v + '</b></div>';
        return head
            + '<div class="scope-card"><div class="price-rows">'
            + '<div class="price-row"><span><b>&nbsp;</b></span><b>International only</b></div>'
            + '<div class="price-row"><span>International sales</span><b>' + pct(intlRate()) + '</b></div>'
            + '<div class="price-row"><span>Domestic sales</span><b>' + pct(RATE.dom) + ' &mdash; unchanged</b></div>'
            + '</div><div class="coverage-divider" style="height:1px;border-top:1px solid var(--neutral-50);margin:12px 0"></div>'
            + '<div class="price-rows">'
            + '<div class="price-row"><span><b>&nbsp;</b></span><b>All sales</b></div>'
            + '<div class="price-row"><span>International sales</span><b>' + pct(intlRate()) + '</b></div>'
            + '<div class="price-row"><span>Domestic sales</span><b style="color:#8a5a11">'
            + pct(RATE.dom) + ' &rarr; ' + pct(RATE.dom + RATE.smp) + '</b></div>'
            + '</div></div>'
            + opts;
    }

    // 3A — volume bar. The domestic segment lighting up *is* the disclosure:
    // the change is visible as area, not only as a number.
    return head
        + '<div class="scope-card">'
        + '<div class="vol-bar">'
        + '<div class="vol-seg dom' + (all ? ' covered' : '') + '">Domestic &middot; ' + pct(domRate(STATE.scope)) + '</div>'
        + '<div class="vol-seg intl">International &middot; ' + pct(intlRate()) + '</div>'
        + '</div>'
        + '<div class="vol-legend">'
        + '<span><i style="background:#675dff"></i>Covered by Managed Payments</span>'
        + '<span><i style="background:#c3cbd6"></i>Standard Stripe pricing</span>'
        + '</div>'
        + '<div class="vol-caption">Illustrative split (' + MIX.dom + '% domestic / ' + MIX.intl
        + '% international) to show proportion &mdash; not your actual volume.</div>'
        + '<div class="rate-strip"><span class="label">Your blended rate on that split</span>'
        + '<span class="value">' + pct(effRate(STATE.scope)) + '</span></div>'
        + '</div>'
        + '<div style="height:16px"></div>'
        + opts;
}
function setScope(s) { STATE.scope = s; render(); }

/* ==================================================================
   STEP 4 — Confirm. Two branches, equal fidelity.
   The self-managed branch is the honesty test for the whole flow: if it
   reads as a consolation prize, the recommendation upstream was coercive.
================================================================== */
const ALACARTE = [
    ['Stripe Tax', 'Calculates what you owe in each market and monitors thresholds. Registration and filing stay with you.'],
    ['Radar', 'Fraud rules and machine-learning risk scoring on your payments.'],
    ['Disputes', 'Dashboard tooling to track and respond to chargebacks. Deadlines and evidence are yours to meet.'],
    ['Payment methods', 'Add local methods per market as you expand into them.'],
];

function step4() {
    const head = '<div class="step-eyebrow">Step 4 of 4</div>';

    if (STATE.choice === 'self') {
        return head
            + '<h1 class="headline">You&rsquo;re set up to manage international selling yourself.</h1>'
            + '<div class="sum-card">'
            + '<div class="sum-head"><span class="sum-title">Self-managed</span>'
            + '<span class="tag-neutral">Fully supported</span></div>'
            + '<div class="sum-rows">'
            + '<div class="sum-row"><span class="k">What you pay</span><span class="v">Standard processing &mdash; '
            + '<b>' + pct(RATE.dom) + '</b> domestic, <b>' + pct(RATE.intl) + '</b> international. No added fee.</span></div>'
            + '<div class="sum-row"><span class="k">What you own</span><span class="v">Tax registration and filing, '
            + 'dispute responses, fraud rules, local payment methods, and any local entity or banking setup.</span></div>'
            + '<div class="sum-row"><span class="k">What changes today</span><span class="v">Nothing. '
            + 'You can start taking payments now.</span></div>'
            + '</div></div>'
            + '<div class="feat-head">Stripe products that cover this work<span class="todo-flag">Placeholder &mdash; needs the real list</span></div>'
            + '<div class="alc-list">'
            + ALACARTE.map(a => '<div class="alc"><span class="alc-name">' + a[0] + '</span>'
                + '<span class="alc-desc">' + a[1] + '</span></div>').join('')
            + '</div>'
            + '<div class="reversible">Managed Payments stays available. You can switch to it at any '
            + 'time from your payment settings &mdash; there&rsquo;s nothing to undo here first.</div>';
    }

    const all = STATE.scope === 'all';
    return head
        + '<h1 class="headline">Managed Payments is on.</h1>'
        + '<div class="sum-card">'
        + '<div class="sum-head"><span class="sum-title">Managed Payments</span>'
        + '<span class="tag-rec">' + (all ? 'All sales' : 'International sales') + '</span></div>'
        + '<div class="sum-rows">'
        + '<div class="sum-row"><span class="k">What Stripe manages</span><span class="v">Tax registration and '
        + 'remittance, disputes, fraud, local payment methods, and local processing on your '
        + (all ? 'domestic and international' : 'international') + ' sales.</span></div>'
        + '<div class="sum-row"><span class="k">What you pay</span><span class="v">'
        + '<b>' + pct(intlRate()) + '</b> on international sales'
        + (all ? ' and <b>' + pct(RATE.dom + RATE.smp) + '</b> on domestic sales.'
               : ', and <b>' + pct(RATE.dom) + '</b> on domestic sales &mdash; unchanged.') + '</span></div>'
        + '<div class="sum-row"><span class="k">Blended rate</span><span class="v"><b>'
        + pct(effRate(STATE.scope)) + '</b> on an illustrative ' + MIX.dom + '/' + MIX.intl + ' split.</span></div>'
        + '</div></div>'
        + '<div class="today-note"><span>&#10003;</span><span>'
        + (all
            ? '<b>The domestic fee starts with your next domestic sale.</b> You chose to extend '
              + 'Managed Payments to all sales, so the ' + pct(RATE.dom + RATE.smp) + ' rate applies at home too.'
            : '<b>You&rsquo;re paying nothing extra today.</b> The Managed Payments fee applies only to '
              + 'international sales, so it starts the first time you make one. If that never happens, '
              + 'it never costs you anything.')
        + '</span></div>'
        + '<div class="reversible">You can change coverage or turn Managed Payments off at any time '
        + 'in your payment settings.</div>';
}

/* ==================================================================
   Shell: nav, footer, control panel
================================================================== */
function footer() {
    const back = STATE.step > 1
        ? '<button class="btn-ghost" onclick="go(-1)">Back</button>'
        : '<span></span>';

    if (STATE.step === 1) {
        return back + '<div><button class="btn btn-primary" onclick="go(1)">Continue</button></div>';
    }
    if (STATE.step === 2) {
        const ready = STATE.choice !== null;
        return back + '<div style="display:flex;align-items:center;gap:12px">'
            + (ready ? '' : '<span style="font-size:12px;color:var(--text-muted)">Choose an option to continue</span>')
            + '<button class="btn btn-primary" onclick="go(1)"' + (ready ? '' : ' disabled') + '>Continue</button>'
            + '</div>';
    }
    if (STATE.step === 3) {
        return back + '<div><button class="btn btn-primary" onclick="go(1)">Continue</button></div>';
    }
    return back + '<div><button class="btn btn-primary" onclick="alert(\'End of prototype.\')">Done</button></div>';
}

function go(d) {
    let next = STATE.step + d;
    // Scope only exists on the SMP branch. Self-managed skips step 3 in both
    // directions rather than showing a screen that doesn't apply.
    if (next === 3 && STATE.choice === 'self') next += d;
    STATE.step = Math.max(1, Math.min(4, next));
    render();
}

const CP_NOTES = {
    '1B': '<b>1B Trigger list, collapsed.</b> Headline claim readable in five seconds, detail on demand. Every row says &ldquo;Stripe handles it&rdquo; &mdash; the repetition is the argument.',
    '1D': '<b>1D Radical restraint.</b> One claim, the anchor copy, nothing else. The control for whether step 1 earns its space.',
    '2B': '<b>2B Asymmetric.</b> Leading candidate. Managed Payments gets primacy; self-managed stays complete and correctly priced. Both prices inline, never behind a click.',
    '2A': '<b>2A Banner + symmetrical columns.</b> The check on 2B: opinion lives in copy, not in visual weight. Hardest version to accuse of stacking the deck.',
    '2C': '<b>2C Workload diff.</b> Patches the frame&rsquo;s weakness &mdash; &ldquo;Stripe handles it&rdquo; never says what you&rsquo;d otherwise do. Watch for tipping into fear framing.',
    '2E': '<b>2E Diagnostic, not a candidate.</b> Comparison one click away. Measures whether &ldquo;don&rsquo;t worry about it now&rdquo; suppresses reading the price.',
    '3A': '<b>3A Volume bar.</b> Candidate. The domestic segment turning purple <i>is</i> the disclosure &mdash; the change is visible as area, not only as a number.',
    '3B': '<b>3B Rate table.</b> Most literal disclosure. Risks the four-numbers-at-once problem that split steps 2 and 3 in the first place.',
    '3C': '<b>3C Priced options only.</b> Control. If this is as clear as 3A, the visual isn&rsquo;t earning its space.',
};

function controlPanel() {
    const mk = (id, opts, key) => {
        document.getElementById(id).innerHTML = opts.map(o =>
            '<button class="cp-btn' + (STATE[key] === o ? ' on' : '')
            + (o === '2E' ? ' instr' : '') + '" onclick="setT(\'' + key + '\',\'' + o + '\')">'
            + o + '</button>').join('');
    };
    document.getElementById('cpStep').innerHTML = [1, 2, 3, 4].map(s => {
        const skip = s === 3 && STATE.choice === 'self';
        return '<button class="cp-btn' + (STATE.step === s ? ' on' : '') + '" '
            + (skip ? 'disabled title="Self-managed skips scope" ' : '')
            + 'onclick="STATE.step=' + s + ';render()">' + s + '</button>';
    }).join('');
    mk('cpT1', ['1B', '1D'], 't1');
    mk('cpT2', ['2B', '2A', '2C', '2E'], 't2');
    mk('cpT3', ['3A', '3B', '3C'], 't3');

    const key = STATE.step === 1 ? STATE.t1 : STATE.step === 2 ? STATE.t2 : STATE.step === 3 ? STATE.t3 : null;
    document.getElementById('cpNote').innerHTML = key
        ? CP_NOTES[key]
        : '<b>Step 4 Confirm.</b> Branches on the step 2 choice. The self-managed branch is the honesty test: if it reads as a consolation prize, the recommendation upstream was coercive.';
}

function setT(key, v) {
    STATE[key] = v;
    if (key === 't2') STATE.cmpOpen = false;
    render();
}

function render() {
    const fns = { 1: step1, 2: step2, 3: step3, 4: step4 };
    document.getElementById('stage').innerHTML = fns[STATE.step]();
    document.getElementById('footer').innerHTML = footer();
    document.getElementById('progFill').style.width = (STATE.step / 4 * 100) + '%';
    controlPanel();
}
render();
</script>
</body>
</html>
