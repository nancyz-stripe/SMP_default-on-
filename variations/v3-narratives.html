<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 — three growth narratives</title>
<style>
    /* Same tokens as the rest of the family. */
    :root {
        --bg-surface: #ffffff;
        --bg-offset: #f5f6f8;
        --text-default: #353a44;
        --text-subdued: #596171;
        --text-heading: #21252c;
        --text-muted: #99a5b8;
        --text-action-primary: #533afd;
        --icon-action-primary: #675dff;
        --border-action-primary-strong: #533afd;
        --border-default: #d4dee9;
        --bg-form-accent: #675dff;
        --neutral-200: #b6c0cd;
        --neutral-50: #ebeef1;
        --shadow-overlay: 0px 15px 35px 0px rgba(48, 49, 61, 0.08), 0px 5px 15px 0px rgba(0, 0, 0, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
        background: var(--bg-offset); overflow: hidden; height: 100vh; width: 100vw;
    }

    .dashboard { display: flex; height: 100vh; width: 100vw; }
    .sidebar {
        width: 240px; background: var(--bg-surface); border-right: 1px solid var(--neutral-50);
        padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-logo { padding: 8px 12px; margin-bottom: 20px; }
    .nav-item { padding: 8px 12px; border-radius: 6px; font-size: 14px; color: var(--text-subdued); }
    .nav-item.active { background: var(--bg-offset); color: var(--text-default); font-weight: 500; }
    .main-content { flex: 1; background: var(--bg-offset); padding: 32px; }
    .content-placeholder { height: 200px; background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--neutral-50); }

    .modal-backdrop {
        position: fixed; inset: 0; background: rgba(182, 192, 205, 0.7);
        display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
        width: 86%; height: 84%; max-width: 940px; background: var(--bg-surface);
        border-radius: 12px; box-shadow: var(--shadow-overlay);
        display: flex; flex-direction: column; overflow: hidden; position: relative; padding: 16px;
    }
    .modal-gradient {
        position: absolute; inset: 16px; border-radius: 8px; z-index: 0;
        background:
            radial-gradient(52% 70% at 46% 70%, rgba(207, 226, 255, 0.24) 0%, rgba(207, 226, 255, 0) 94%),
            radial-gradient(105% 45% at 93% 37%, rgba(216, 128, 236, 0.22) 0%, rgba(216, 128, 236, 0) 79%),
            radial-gradient(60% 46% at 105% 72%, rgba(254, 180, 203, 0.36) 0%, rgba(254, 180, 203, 0) 103%),
            #fefefe;
    }
    .modal-header, .modal-body, .modal-footer { position: relative; z-index: 1; }
    .modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 26px 48px 0; flex-shrink: 0;
    }
    .progress { display: flex; gap: 5px; }
    .pip {
        width: 22px; height: 4px; border-radius: 2px; background: var(--neutral-50);
        transition: background 0.5s ease;
    }
    .pip.on { background: var(--icon-action-primary); }

    .modal-body {
        flex: 1; min-height: 0; overflow-y: auto; padding: 28px 48px 8px;
        display: flex; flex-direction: column; justify-content: center;
    }
    .modal-body > .inner { width: 100%; max-width: 660px; margin: 0 auto; }
    .modal-footer {
        flex-shrink: 0; padding: 14px 48px 24px; display: flex; align-items: center;
        justify-content: space-between; gap: 16px;
    }

    /* ---------- fluidity ----------
       Every screen fades up as one piece, then its parts settle in sequence.
       Only opacity and transform animate — animating layout is what made the
       older upgrade moment glitch. */
    .inner { animation: screen-in 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .seq { animation: seq-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes seq-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
        .inner, .seq { animation: none; }
    }

    /* ---------- type ---------- */
    h1.lede {
        font-size: 25px; line-height: 33px; font-weight: 600; letter-spacing: -0.5px;
        color: var(--text-heading); margin-bottom: 14px;
    }
    h1.lede .muted { color: var(--text-muted); font-weight: 600; }
    .body-copy {
        font-size: 15px; line-height: 23px; color: var(--text-subdued);
        letter-spacing: -0.15px; margin-bottom: 20px;
    }
    /* The closing reassurance. Quiet on purpose — it's the last thing read,
       not the loudest. */
    .closer {
        font-size: 14px; line-height: 21px; color: var(--text-default);
        padding-top: 16px; margin-top: 4px; border-top: 1px solid var(--neutral-50);
    }

    /* ---------- the things that come up ----------
       They arrive on their own, staggered. Nothing to expand: the reveal is
       the progressive disclosure, so the screen stays a reading experience
       rather than a set of controls. */
    .things { display: flex; flex-direction: column; gap: 1px; }
    .thing {
        display: flex; align-items: center; gap: 14px; padding: 12px 2px;
        border-top: 1px solid var(--neutral-50);
    }
    .thing:first-child { border-top: none; }
    .thing-what { flex: 1; font-size: 14px; line-height: 20px; color: var(--text-default); }
    .thing-what small { display: block; font-size: 12px; line-height: 17px; color: var(--text-muted); margin-top: 1px; }
    .thing-who {
        flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px;
        background: #efecfc; border: 1px solid #c3b6fb; color: #44139f;
    }

    /* ---------- choices ----------
       Two cards, three lines each. No feature lists: the narrative already
       said what Stripe does, so repeating it here would be the wall again. */
    .choices { display: flex; gap: 14px; }
    .choice {
        flex: 1; min-width: 0; background: var(--bg-surface); border: 2px solid var(--border-default);
        border-radius: 10px; padding: 17px; cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .choice:hover { border-color: var(--neutral-200); transform: translateY(-1px); }
    .choice.on { border-color: var(--border-action-primary-strong); box-shadow: 0 0 0 1px var(--border-action-primary-strong); }
    .choice-head { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; flex-wrap: wrap; }
    .choice-title { font-size: 15px; font-weight: 600; color: var(--text-heading); }
    .choice-line { font-size: 13px; line-height: 19px; color: var(--text-subdued); margin-bottom: 12px; }
    .choice-price {
        font-size: 15px; font-weight: 700; color: var(--text-heading); letter-spacing: -0.2px;
        font-variant-numeric: tabular-nums;
    }
    .choice-price small {
        display: block; font-size: 12px; line-height: 17px; font-weight: 400; letter-spacing: 0;
        color: var(--text-subdued); margin-top: 3px;
    }
    .tag-rec {
        display: inline-flex; padding: 2px 8px; background: var(--icon-action-primary);
        border-radius: 4px; font-size: 10px; font-weight: 600; color: #fff; letter-spacing: 0.3px;
    }
    .tag-alt {
        display: inline-flex; padding: 2px 8px; background: var(--bg-offset);
        border: 1px solid var(--border-default); border-radius: 4px; font-size: 10px;
        font-weight: 600; color: var(--text-subdued); letter-spacing: 0.3px;
    }

    /* ---------- confirm ---------- */
    .done-row {
        display: flex; align-items: flex-start; gap: 11px; font-size: 14px; line-height: 21px;
        color: var(--text-default); padding: 9px 0;
    }
    .tick {
        flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: #2f9e44;
        color: #fff; display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .tick svg { width: 10px; height: 10px; }
    /* The soft expansion offer. Deliberately not a step of its own: extending
       to domestic is an addition, not a gate, so it sits under the
       confirmation where it can be ignored entirely. */
    .expand {
        margin-top: 20px; padding: 16px 17px; border-radius: 10px;
        background: rgba(255,255,255,0.72); border: 1px solid var(--border-default);
    }
    .expand-title { font-size: 14px; font-weight: 600; color: var(--text-heading); margin-bottom: 4px; }
    .expand-body { font-size: 13px; line-height: 19px; color: var(--text-subdued); }
    .expand-row {
        display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 13px;
    }
    /* Both timings stated symmetrically. Nothing is charged today either way —
       the honest difference is "might never" vs. "starts with your first sale". */
    .expand-when { font-size: 12px; line-height: 17px; color: var(--text-default); }
    .expand-when b { font-weight: 600; }
    .switch {
        flex-shrink: 0; width: 40px; height: 23px; border-radius: 100px; background: var(--neutral-200);
        border: none; cursor: pointer; padding: 0; position: relative;
        transition: background 0.24s ease;
    }
    .switch.on { background: var(--bg-form-accent); }
    .switch i {
        position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%;
        background: #fff; transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .switch.on i { transform: translateX(17px); }
    .rate-line {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        margin-top: 14px; padding: 10px 12px; background: var(--bg-offset); border-radius: 7px;
    }
    .rate-line span { font-size: 12px; color: var(--text-subdued); }
    .rate-line b { font-size: 16px; color: var(--text-heading); font-variant-numeric: tabular-nums; }
    .quiet { font-size: 13px; line-height: 19px; color: var(--text-subdued); margin-top: 16px; }
    .todo-flag {
        font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
        color: #8a5a11; background: #fdf3e7; border: 1px solid #f3d9b0;
        padding: 1px 6px; border-radius: 3px; margin-left: 8px;
    }

    .btn {
        font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.15px;
        padding: 9px 17px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
        transition: filter 0.15s, background 0.15s;
    }
    .btn-primary { background: var(--bg-form-accent); color: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.12); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost {
        background: none; border: none; color: var(--text-subdued); font-family: inherit;
        font-size: 14px; cursor: pointer; padding: 9px 4px;
    }
    .btn-ghost:hover { color: var(--text-default); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .control-panel {
        position: fixed; bottom: 16px; left: 16px; z-index: 500; width: 292px;
        padding: 14px; background: var(--bg-surface); border-radius: 12px;
        border: 1px solid var(--neutral-50); box-shadow: 0 6px 20px rgba(0,0,0,0.12); font-size: 12px;
    }
    .cp-title { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .cp-group { margin-bottom: 12px; }
    .cp-label { font-size: 11px; font-weight: 600; color: var(--text-subdued); margin-bottom: 5px; }
    .cp-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .cp-btn {
        font-family: inherit; font-size: 11px; padding: 4px 9px; border-radius: 5px;
        border: 1px solid var(--border-default); background: var(--bg-surface);
        color: var(--text-subdued); cursor: pointer; text-align: left;
    }
    .cp-btn.on { background: var(--bg-form-accent); border-color: var(--bg-form-accent); color: #fff; font-weight: 600; }
    .cp-note { font-size: 11px; line-height: 16px; color: var(--text-muted); border-top: 1px solid var(--neutral-50); padding-top: 10px; }
    .cp-note b { color: var(--text-subdued); }
</style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-logo">
            <svg viewBox="0 0 60 25" fill="#675dff" width="60" height="24"><path d="M59.64 14.28h-8.06c.19 1.93 1.6 2.55 3.2 2.55 1.64 0 2.96-.37 4.05-.95v3.32a8.33 8.33 0 0 1-4.56 1.1c-4.01 0-6.83-2.5-6.83-7.48 0-4.19 2.39-7.52 6.3-7.52 3.92 0 5.96 3.28 5.96 7.5 0 .4-.04 1.26-.06 1.48zm-5.92-5.62c-1.03 0-2.17.73-2.17 2.58h4.25c0-1.85-1.07-2.58-2.08-2.58zM40.95 20.3c-1.44 0-2.32-.6-2.9-1.04l-.02 4.63-4.12.87V5.57h3.76l.08 1.02a4.7 4.7 0 0 1 3.23-1.29c2.9 0 5.62 2.6 5.62 7.4 0 5.23-2.7 7.6-5.65 7.6zM40 8.95c-.95 0-1.54.34-1.97.81l.02 6.12c.4.44.98.78 1.95.78 1.52 0 2.54-1.65 2.54-3.87 0-2.15-1.04-3.84-2.54-3.84zM28.24 5.57h4.13v14.44h-4.13V5.57zm0-4.7L32.37 0v3.36l-4.13.88V.88zm-4.32 9.35v9.79H19.8V5.57h3.7l.12 1.22c1-1.77 3.07-1.41 3.62-1.22v3.79c-.52-.17-2.29-.43-3.32.86zm-8.55 4.72c0 2.43 2.6 1.68 3.12 1.46v3.36c-.55.3-1.54.54-2.89.54a4.15 4.15 0 0 1-4.27-4.24l.01-13.17 4.02-.86v3.54h3.13V9.1h-3.12v5.85zm-4.91.7c0 2.97-2.31 4.66-5.73 4.66a11.2 11.2 0 0 1-4.46-.93v-3.93c1.38.75 3.1 1.31 4.46 1.31.92 0 1.53-.24 1.53-1C4.26 14.37 0 15.15 0 9.85c0-2.92 2.24-4.66 5.58-4.66 1.24 0 2.5.2 3.73.7v3.88a8.35 8.35 0 0 0-3.73-.96c-.86 0-1.4.25-1.4.9 0 1.85 4.28.97 4.28 6.02z"/></svg>
        </div>
        <div class="nav-item">Home</div>
        <div class="nav-item">Balances</div>
        <div class="nav-item active">Get started</div>
        <div class="nav-item">Products</div>
    </div>
    <div class="main-content"><div class="content-placeholder"></div></div>
</div>

<div class="modal-backdrop">
    <div class="modal">
        <div class="modal-gradient"></div>
        <div class="modal-header">
            <svg viewBox="0 0 60 25" fill="#0a2540" width="60" height="25"><path d="M59.64 14.28h-8.06c.19 1.93 1.6 2.55 3.2 2.55 1.64 0 2.96-.37 4.05-.95v3.32a8.33 8.33 0 0 1-4.56 1.1c-4.01 0-6.83-2.5-6.83-7.48 0-4.19 2.39-7.52 6.3-7.52 3.92 0 5.96 3.28 5.96 7.5 0 .4-.04 1.26-.06 1.48zm-5.92-5.62c-1.03 0-2.17.73-2.17 2.58h4.25c0-1.85-1.07-2.58-2.08-2.58zM40.95 20.3c-1.44 0-2.32-.6-2.9-1.04l-.02 4.63-4.12.87V5.57h3.76l.08 1.02a4.7 4.7 0 0 1 3.23-1.29c2.9 0 5.62 2.6 5.62 7.4 0 5.23-2.7 7.6-5.65 7.6zM40 8.95c-.95 0-1.54.34-1.97.81l.02 6.12c.4.44.98.78 1.95.78 1.52 0 2.54-1.65 2.54-3.87 0-2.15-1.04-3.84-2.54-3.84zM28.24 5.57h4.13v14.44h-4.13V5.57zm0-4.7L32.37 0v3.36l-4.13.88V.88zm-4.32 9.35v9.79H19.8V5.57h3.7l.12 1.22c1-1.77 3.07-1.41 3.62-1.22v3.79c-.52-.17-2.29-.43-3.32.86zm-8.55 4.72c0 2.43 2.6 1.68 3.12 1.46v3.36c-.55.3-1.54.54-2.89.54a4.15 4.15 0 0 1-4.27-4.24l.01-13.17 4.02-.86v3.54h3.13V9.1h-3.12v5.85zm-4.91.7c0 2.97-2.31 4.66-5.73 4.66a11.2 11.2 0 0 1-4.46-.93v-3.93c1.38.75 3.1 1.31 4.46 1.31.92 0 1.53-.24 1.53-1C4.26 14.37 0 15.15 0 9.85c0-2.92 2.24-4.66 5.58-4.66 1.24 0 2.5.2 3.73.7v3.88a8.35 8.35 0 0 0-3.73-.96c-.86 0-1.4.25-1.4.9 0 1.85 4.28.97 4.28 6.02z"/></svg>
            <div class="progress" id="prog"></div>
        </div>
        <div class="modal-body"><div class="inner" id="stage"></div></div>
        <div class="modal-footer" id="footer"></div>
    </div>
</div>

<div class="control-panel">
    <div class="cp-title">V3 — narratives</div>
    <div class="cp-group">
        <div class="cp-label">Narrative</div>
        <div class="cp-btns" id="cpNar" style="flex-direction:column;align-items:stretch"></div>
    </div>
    <div class="cp-group">
        <div class="cp-label">Screen</div>
        <div class="cp-btns" id="cpStep"></div>
    </div>
    <div class="cp-note" id="cpNote"></div>
</div>

<script>
const RATE = { dom: 2.9, intl: 3.4, smp: 3.5 };
const MIX = { dom: 68, intl: 32 };
const pct = n => n.toFixed(1) + '%';
const intlRate = () => RATE.intl + RATE.smp;
const domRate = all => all ? RATE.dom + RATE.smp : RATE.dom;
const blended = all => (MIX.dom / 100) * domRate(all) + (MIX.intl / 100) * intlRate();

const STATE = { nar: 'alone', step: 1, choice: null, domestic: false };
(function () {
    const q = new URLSearchParams(location.search);
    if (['ready', 'evidence', 'alone'].includes(q.get('n'))) STATE.nar = q.get('n');
    const s = parseInt(q.get('s'), 10);
    if (s >= 1 && s <= 3) STATE.step = s;
    if (STATE.step === 3) STATE.choice = q.get('choice') === 'self' ? 'self' : 'smp';
})();

/* The four things that come up. Four, not seven — the point is recognition,
   not inventory. Each is one line with a quiet second line; no expanding. */
const THINGS = [
    ['Local payment methods', 'What customers in each market expect to pay with'],
    ['Tax thresholds', 'Registering and remitting once you pass one somewhere'],
    ['Disputes', 'Different deadlines and evidence rules in every market'],
    ['Fraud', 'Patterns that vary market by market'],
];

/* ------------------------------------------------------------------
   The three narratives.

   Same opening move in all three — "you sell digital goods, so you'll
   grow" — because that's settled. They diverge on which beat carries
   the weight: readiness, evidence, or partnership.
------------------------------------------------------------------ */
const NARRATIVES = {
    ready: {
        name: 'Set up now, ready when you are',
        lede: 'You&rsquo;re selling digital goods, which means you can grow faster than you expect '
            + '&mdash; <span class="muted">and in directions you can&rsquo;t really predict.</span>',
        body: 'This is how we&rsquo;d set you up: ready for whatever turns up, whenever it does.',
        thingsIntro: 'Ready for',
        closer: 'Until then, nothing changes and nothing costs you anything.',
        note: '<b>Readiness.</b> The calmest of the three &mdash; nobody is asked to do or decide '
            + 'anything. Weakest at making the fee feel earned, because it relieves an anxiety it '
            + 'never raises.',
    },
    evidence: {
        name: 'Ready before you need it',
        lede: 'You&rsquo;re selling digital goods, which means you&rsquo;re going to grow. '
            + '<span class="muted">Growth can get complicated.</span>',
        body: 'Here&rsquo;s what businesses like yours deal with as they grow.',
        thingsIntro: null,
        // Their copy, with the missing full stop restored.
        closer: 'Managed Payments is how Stripe handles it. Only pay for what you need, and stay '
            + 'in control.',
        note: '<b>Evidence.</b> The only one that shows the merchant something before asking for '
            + 'trust, which is what gives the fee something to attach to. Its closing line is the '
            + 'weakest of the three &mdash; it names the product early and swaps the conditional '
            + 'cost for two vaguer claims.',
    },
    alone: {
        name: 'You won&rsquo;t be doing this alone',
        lede: 'You&rsquo;re selling digital goods, which means you&rsquo;re going to grow. '
            + '<span class="muted">Growing means running into things you haven&rsquo;t seen before.</span>',
        body: 'You don&rsquo;t need to work any of it out on your own. We&rsquo;ve seen these '
            + 'thousands of times, and we&rsquo;ll tell you when something happens.',
        thingsIntro: null,
        closer: 'There&rsquo;s nothing for you to do now, and nothing to pay until it happens.',
        note: '<b>Partnership.</b> Warmest, and the one that best matches &ldquo;a partner that '
            + 'adapts over time&rdquo;. Carries the visibility promise the other two are missing.',
    },
};
const nar = () => NARRATIVES[STATE.nar] || NARRATIVES.alone;

/* ==================================================================
   SCREEN 1 — the narrative
   One read, no controls. The list arrives on its own.
================================================================== */
function screen1() {
    const n = nar();
    let d = 0;
    const next = () => 'style="animation-delay:' + (d += 90) + 'ms"';
    return '<h1 class="lede seq" style="animation-delay:60ms">' + n.lede + '</h1>'
        + '<p class="body-copy seq" style="animation-delay:220ms">' + n.body + '</p>'
        + (n.thingsIntro
            ? '<div class="body-copy seq" style="animation-delay:300ms;margin-bottom:8px">'
              + n.thingsIntro + '</div>' : '')
        + '<div class="things">'
        + THINGS.map((t) => {
            d = Math.max(d, 300);
            return '<div class="thing seq" ' + next() + '>'
                + '<span class="thing-what">' + t[0] + '<small>' + t[1] + '</small></span>'
                + '<span class="thing-who">Stripe</span></div>';
        }).join('')
        + '</div>'
        + '<p class="closer seq" style="animation-delay:' + (d + 140) + 'ms">' + n.closer + '</p>';
}

/* ==================================================================
   SCREEN 2 — the one decision
   Two cards, three lines each. The narrative already said what Stripe
   does, so repeating it as feature lists would rebuild the wall.
================================================================== */
function screen2() {
    return '<h1 class="lede seq" style="animation-delay:60ms">We&rsquo;d handle your international '
        + 'sales for you. <span class="muted">Or you can handle them yourself &mdash; both work.</span></h1>'
        + '<div class="choices seq" style="animation-delay:200ms">'
        + '<div class="choice' + (STATE.choice === 'smp' ? ' on' : '') + '" onclick="choose(\'smp\')">'
        + '<div class="choice-head"><span class="choice-title">We handle it</span>'
        + '<span class="tag-rec">Recommended</span></div>'
        + '<div class="choice-line">We deal with each thing as it comes up, and tell you what happened.</div>'
        + '<div class="choice-price">' + pct(intlRate()) + ' on international sales'
        + '<small>' + pct(RATE.dom) + ' on domestic, unchanged. Nothing until you sell abroad.</small></div>'
        + '</div>'
        + '<div class="choice' + (STATE.choice === 'self' ? ' on' : '') + '" onclick="choose(\'self\')">'
        + '<div class="choice-head"><span class="choice-title">You handle it</span>'
        + '<span class="tag-alt">Also supported</span></div>'
        + '<div class="choice-line">You&rsquo;ll see the same things we would, and decide what to do.</div>'
        + '<div class="choice-price">' + pct(RATE.intl) + ' on international sales'
        + '<small>' + pct(RATE.dom) + ' on domestic. No added fee.</small></div>'
        + '</div></div>'
        + '<p class="quiet seq" style="animation-delay:340ms">You can switch either way later.</p>';
}
function choose(c) { STATE.choice = c; render(); }

/* ==================================================================
   SCREEN 3 — confirm, with the domestic offer folded in

   Extending to domestic is an addition rather than a gate, so it sits
   under the confirmation as one optional switch instead of its own
   screen. That keeps the flow at three screens and one decision each.
================================================================== */
function screen3() {
    if (STATE.choice === 'self') {
        return '<h1 class="lede seq" style="animation-delay:60ms">You&rsquo;ve got it '
            + 'from here. <span class="muted">We&rsquo;ll keep you posted either way.</span></h1>'
            + '<div class="seq" style="animation-delay:200ms">'
            + row('You&rsquo;re on standard pricing &mdash; <b>' + pct(RATE.dom) + '</b> domestic, <b>'
                + pct(RATE.intl) + '</b> international. No added fee.')
            + row('You&rsquo;ll see the same things we&rsquo;d see: tax thresholds as you approach them, '
                + 'disputes as they land.')
            + row('Handling them is yours &mdash; tax registration, dispute responses, fraud rules.')
            + '</div>'
            + '<p class="quiet seq" style="animation-delay:360ms">Stripe Tax, Radar, and dispute tools '
            + 'are there when you want them.<span class="todo-flag">Needs the real list</span></p>'
            + '<p class="quiet seq" style="animation-delay:420ms">If you&rsquo;d rather hand it over '
            + 'later, you can do that any time.</p>';
    }
    const all = STATE.domestic;
    return '<h1 class="lede seq" style="animation-delay:60ms">Done &mdash; we&rsquo;ve got your '
        + 'international sales. <span class="muted">Nothing else for you to do.</span></h1>'
        + '<div class="seq" style="animation-delay:200ms">'
        + row('We handle tax, disputes, fraud, and local payment methods on sales outside your market.')
        + row('You&rsquo;ll hear from us when something happens &mdash; what it was, and what we did.')
        + row('<b>' + pct(intlRate()) + '</b> on international sales. It starts the first time you make one.')
        + '</div>'
        + '<div class="expand seq" style="animation-delay:340ms">'
        + '<div class="expand-title">Want us to handle your local sales too?</div>'
        + '<div class="expand-body">Same thing, across your whole business &mdash; one way of working '
        + 'rather than two.</div>'
        + '<div class="expand-row">'
        + '<span class="expand-when">'
        + (all
            ? '<b>Starts with your next sale, wherever it is.</b> Your domestic rate goes from '
              + pct(RATE.dom) + ' to ' + pct(RATE.dom + RATE.smp) + '.'
            : '<b>Off.</b> Your domestic sales stay at ' + pct(RATE.dom) + ', exactly as they are.')
        + '</span>'
        + '<button class="switch' + (all ? ' on' : '') + '" onclick="STATE.domestic=!STATE.domestic;render()">'
        + '<i></i></button></div>'
        + '<div class="rate-line"><span>Blended rate on an illustrative ' + MIX.dom + '/' + MIX.intl
        + ' split</span><b>' + pct(blended(all)) + '</b></div>'
        + '</div>'
        + '<p class="quiet seq" style="animation-delay:440ms">Change or turn this off any time in '
        + 'payment settings.</p>';
}
function row(html) {
    return '<div class="done-row"><span class="tick">'
        + '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">'
        + '<path d="M2 6.4 4.6 9 10 3.2"/></svg></span><span>' + html + '</span></div>';
}

/* ==================================================================
   Shell
================================================================== */
function footer() {
    const back = STATE.step > 1 ? '<button class="btn-ghost" onclick="go(-1)">Back</button>' : '<span></span>';
    if (STATE.step === 1) return back + '<button class="btn btn-primary" onclick="go(1)">Continue</button>';
    if (STATE.step === 2) {
        const ready = STATE.choice !== null;
        return back + '<button class="btn btn-primary" onclick="go(1)"' + (ready ? '' : ' disabled')
            + '>' + (STATE.choice === 'self' ? 'I&rsquo;ll handle it' : 'Sounds good') + '</button>';
    }
    return back + '<button class="btn btn-primary" onclick="alert(\'End of prototype.\')">Done</button>';
}

function go(d) { STATE.step = Math.max(1, Math.min(3, STATE.step + d)); render(); }

function render() {
    const fns = { 1: screen1, 2: screen2, 3: screen3 };
    const stage = document.getElementById('stage');
    // Re-trigger the screen-level animation on every change, so moving between
    // screens reads as one continuous motion rather than a cut.
    stage.style.animation = 'none';
    stage.innerHTML = fns[STATE.step]();
    void stage.offsetWidth;
    stage.style.animation = '';
    document.getElementById('footer').innerHTML = footer();
    document.getElementById('prog').innerHTML = [1, 2, 3].map(i =>
        '<span class="pip' + (i <= STATE.step ? ' on' : '') + '"></span>').join('');

    document.getElementById('cpNar').innerHTML = Object.keys(NARRATIVES).map(k =>
        '<button class="cp-btn' + (STATE.nar === k ? ' on' : '') + '" onclick="setNar(\'' + k + '\')">'
        + NARRATIVES[k].name + '</button>').join('');
    document.getElementById('cpStep').innerHTML = [1, 2, 3].map(i =>
        '<button class="cp-btn' + (STATE.step === i ? ' on' : '') + '" onclick="STATE.step=' + i
        + ';render()">' + i + '</button>').join('');
    document.getElementById('cpNote').innerHTML = STATE.step === 1
        ? nar().note
        : (STATE.step === 2
            ? '<b>One decision.</b> Two cards, three lines each, both priced. No feature lists &mdash; '
              + 'the narrative already said what Stripe does.'
            : '<b>Confirm.</b> The domestic offer sits here as one optional switch rather than its own '
              + 'screen: it&rsquo;s an addition, not a gate. Both timings stated symmetrically.');
}
function setNar(k) { STATE.nar = k; render(); }
render();
</script>
</body>
</html>
