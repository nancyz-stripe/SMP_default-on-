<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #092540; }
    canvas { display: block; }
    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 8px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      z-index: 10;
      min-width: 220px;
    }
    #controls h3 { margin-bottom: 12px; font-size: 14px; opacity: 0.9; }
    .control-row { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .control-row label { flex: 1; opacity: 0.8; }
    .control-row input[type="color"] { width: 40px; height: 24px; border: none; cursor: pointer; border-radius: 3px; }
    .btn-row { margin-top: 16px; display: flex; gap: 6px; }
    .btn-row button {
      flex: 1; padding: 6px 8px; cursor: pointer; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
      color: #fff; font-size: 11px; transition: background 0.2s;
    }
    .btn-row button:hover { background: rgba(255,255,255,0.2); }
    #toggle-btn {
      position: fixed; top: 20px; right: 20px;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      padding: 8px 12px; border-radius: 4px; cursor: pointer;
      font-size: 12px; z-index: 11; display: none;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h3>Globe Controls <span style="opacity:0.5;font-weight:normal;font-size:11px;">(Esc to hide)</span></h3>
    <div class="control-row"><label>Globe</label><input type="color" id="globeColor" value="#102038"></div>
    <div class="control-row"><label>Dots</label><input type="color" id="dotColor" value="#306ba6"></div>
    <div class="control-row"><label>Ambient</label><input type="color" id="ambientLight" value="#99e6fc"></div>
    <div class="control-row"><label>Back Light</label><input type="color" id="backLight" value="#c2f0fd"></div>
    <div class="control-row"><label>Front Light</label><input type="color" id="frontLight" value="#a1a5af"></div>
    <div class="control-row"><label>Background</label><input type="color" id="background" value="#092540"></div>
    <div class="btn-row">
      <button onclick="applyWhiteTheme()">White</button>
      <button onclick="applyDarkTheme()">Dark</button>
      <button onclick="copyURL()">Copy URL</button>
    </div>
  </div>
  <button id="toggle-btn" onclick="toggleControls()">Show Controls</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- Config from URL params ---
    const urlParams = new URLSearchParams(window.location.search);
    let config = {
      globeColor: '#' + (urlParams.get('globeColor') || '102038'),
      dotColor: '#' + (urlParams.get('dotColor') || '306ba6'),
      ambientLight: '#' + (urlParams.get('ambientLight') || '99e6fc'),
      backLight: '#' + (urlParams.get('backLight') || 'c2f0fd'),
      frontLight: '#' + (urlParams.get('frontLight') || 'a1a5af'),
      background: '#' + (urlParams.get('background') || '092540'),
    };
    Object.keys(config).forEach(k => {
      const el = document.getElementById(k);
      if (el) el.value = config[k];
    });

    // --- Scene ---
    const scene = new THREE.Scene();
    const w = window.innerWidth, h = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-w/2, w/2, h/2, -h/2, 1, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(new THREE.Color(config.background), 1);
    renderer.sortObjects = false;
    document.body.appendChild(renderer.domElement);

    // Smaller globe, centered
    const globeRadius = 180 + Math.min(w, 1080) * 0.15;
    const globeSegments = Math.floor((globeRadius / 250) * 10) + 20;
    camera.position.z = globeRadius * 4;

    // Globe container - slight tilt to barely show poles, face Americas
    const globeContainer = new THREE.Group();
    globeContainer.rotation.x = Math.PI * 0.1111; // subtle tilt like production
    globeContainer.rotation.y = Math.PI * 0.55; // rotate so Americas (~-90° lng) face viewer
    scene.add(globeContainer);

    // --- Globe sphere ---
    const globeGeometry = new THREE.SphereGeometry(globeRadius, globeSegments, globeSegments);
    const globeMaterial = new THREE.MeshPhongMaterial({
      color: new THREE.Color(config.globeColor),
      transparent: false,
      shininess: 5,
    });
    const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
    globeContainer.add(globeMesh);

    // --- Lighting (matches production positions) ---
    const ambientLightObj = new THREE.AmbientLight(new THREE.Color(config.ambientLight), 1.0);
    scene.add(ambientLightObj);

    const backLightObj = new THREE.PointLight(new THREE.Color(config.backLight), 0.2, 0, 2);
    backLightObj.position.set(-1000, -1100, -3300);
    scene.add(backLightObj);

    const frontLightObj = new THREE.PointLight(new THREE.Color(config.frontLight), 0.8, 0, 20);
    frontLightObj.position.set(-3000, 3000, 3300);
    scene.add(frontLightObj);

    // --- Custom shader dots (pentagon-shaped, animated) ---
    const DOT_COUNT = 40000;
    const DOT_SIDES = 5;
    let dotMesh = null;

    const dotVertexShader = `
      uniform float u_time;
      attribute float a_random;
      varying float v_random;

      void main() {
        v_random = a_random;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        gl_PointSize = 3.0;
      }
    `;

    const dotFragmentShader = `
      uniform float u_time;
      uniform vec3 u_color;
      varying float v_random;

      void main() {
        // Pentagon shape - slightly rotated per dot for organic feel
        vec2 uv = gl_PointCoord * 2.0 - 1.0;
        float rotAngle = v_random * 6.28;
        float cs = cos(rotAngle), sn = sin(rotAngle);
        uv = vec2(uv.x * cs - uv.y * sn, uv.x * sn + uv.y * cs);

        float angle = atan(uv.y, uv.x);
        float radius = length(uv);
        float sides = 5.0;
        float a = 3.14159 / sides;
        float sector = floor(angle / (2.0 * a) + 0.5);
        float sectorAngle = sector * 2.0 * a;
        vec2 tip = vec2(cos(sectorAngle), sin(sectorAngle));
        float d = dot(uv, tip);
        float edge = cos(a);
        if (d > edge) discard;
        if (radius > 0.95) discard;

        // Blink between 50% and 100% opacity, each dot on its own phase
        float blink = 0.75 + 0.25 * sin(u_time * 2.0 + v_random * 12.56);
        gl_FragColor = vec4(u_color, blink);
      }
    `;

    const dotUniforms = {
      u_time: { value: 0 },
      u_color: { value: new THREE.Color(config.dotColor) },
    };

    const mapImg = new Image();
    mapImg.crossOrigin = 'anonymous';
    mapImg.src = 'https://images.ctfassets.net/fzn2n1nzq965/11064gUb2CgTJXKVwAt5J9/297a98a65d04d4fbb979072ce60466ab/map_fill-a78643e8.png';
    mapImg.onload = () => {
      const c = document.createElement('canvas');
      c.width = mapImg.width;
      c.height = mapImg.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(mapImg, 0, 0);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);

      const positions = [];
      const randoms = [];

      for (let i = 0; i < DOT_COUNT; i++) {
        // Golden angle spiral for uniform sphere distribution
        const phi = Math.acos(-1 + (2 * i) / DOT_COUNT); // polar angle: 0=north, PI=south
        const theta = Math.sqrt(DOT_COUNT * Math.PI) * phi; // azimuthal angle

        // Convert to geographic lat/lng
        const latDeg = 90 - (phi * 180 / Math.PI); // +90 (north) to -90 (south)
        const lngDeg = ((theta * 180 / Math.PI) % 360) - 180; // -180 to +180

        // UV for equirectangular map sampling
        const u = (lngDeg + 180) / 360;
        const v = (90 - latDeg) / 180;

        const px = Math.floor(u * c.width) % c.width;
        const py = Math.floor(v * c.height) % c.height;
        const idx = (py * c.width + px) * 4;

        if (imgData.data[idx + 3] > 128) {
          // Convert lat/lng to 3D (Y-up, lng=0 faces +Z)
          const latRad = latDeg * Math.PI / 180;
          const lngRad = lngDeg * Math.PI / 180;
          const x = globeRadius * Math.cos(latRad) * Math.sin(lngRad);
          const y = globeRadius * Math.sin(latRad);
          const z = globeRadius * Math.cos(latRad) * Math.cos(lngRad);
          positions.push(x, y, z);
          randoms.push(Math.random());
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('a_random', new THREE.Float32BufferAttribute(randoms, 1));

      const material = new THREE.ShaderMaterial({
        uniforms: dotUniforms,
        vertexShader: dotVertexShader,
        fragmentShader: dotFragmentShader,
        transparent: true,
        depthWrite: false,
      });

      dotMesh = new THREE.Points(geometry, material);
      globeContainer.add(dotMesh);
    };

    // --- Arc system (gradient-colored, curved, fading) ---
    const arcColors = [
      [new THREE.Color(0xf94148), new THREE.Color(0xffcb57)],
      [new THREE.Color(0xab63ea), new THREE.Color(0x90e0ff)],
      [new THREE.Color(0xf94148), new THREE.Color(0xab63ea)],
      [new THREE.Color(0xffcb57), new THREE.Color(0x90e0ff)],
    ];
    const arcs = [];
    const MAX_ARCS = 5;

    // Create bullseye endpoint marker: 3D sphere center + torus ring (visible from all angles)
    function createEndpointMarker(color) {
      const group = new THREE.Group();

      // Center filled sphere
      const dotGeom = new THREE.SphereGeometry(2.2, 12, 12);
      const dotMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 1.0,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const dot = new THREE.Mesh(dotGeom, dotMat);
      group.add(dot);

      // Torus ring (visible from all angles)
      const ringGeom = new THREE.TorusGeometry(5.5, 0.6, 8, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 1.0,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      group.add(ring);

      // Store materials for opacity control
      group.userData = { dotMat, ringMat };
      return group;
    }

    function setMarkerOpacity(marker, opacity) {
      marker.userData.dotMat.opacity = opacity;
      marker.userData.ringMat.opacity = opacity;
    }

    // Check if a marker is on the front-facing hemisphere (visible to camera)
    function isMarkerVisible(marker) {
      const worldPos = new THREE.Vector3();
      marker.getWorldPosition(worldPos);
      const toCamera = camera.position.clone().normalize();
      const markerDir = worldPos.clone().normalize();
      // Only hide when clearly on the back side (dot product < -0.2)
      return markerDir.dot(toCamera) > -0.2;
    }

    // Major cities on visible land masses for arc endpoints
    const majorCities = [
      { name: 'New York', lat: 40.7, lng: -74.0 },
      { name: 'San Francisco', lat: 37.8, lng: -122.4 },
      { name: 'Mexico City', lat: 19.4, lng: -99.1 },
      { name: 'São Paulo', lat: -23.5, lng: -46.6 },
      { name: 'Buenos Aires', lat: -34.6, lng: -58.4 },
      { name: 'London', lat: 51.5, lng: -0.1 },
      { name: 'Paris', lat: 48.9, lng: 2.3 },
      { name: 'Berlin', lat: 52.5, lng: 13.4 },
      { name: 'Moscow', lat: 55.8, lng: 37.6 },
      { name: 'Dubai', lat: 25.2, lng: 55.3 },
      { name: 'Mumbai', lat: 19.1, lng: 72.9 },
      { name: 'Beijing', lat: 39.9, lng: 116.4 },
      { name: 'Tokyo', lat: 35.7, lng: 139.7 },
      { name: 'Singapore', lat: 1.3, lng: 103.8 },
      { name: 'Sydney', lat: -33.9, lng: 151.2 },
      { name: 'Lagos', lat: 6.5, lng: 3.4 },
      { name: 'Cairo', lat: 30.0, lng: 31.2 },
      { name: 'Johannesburg', lat: -26.2, lng: 28.0 },
      { name: 'Toronto', lat: 43.7, lng: -79.4 },
      { name: 'Chicago', lat: 41.9, lng: -87.6 },
    ];

    function cityToVec3(city) {
      // Same coordinate system as dots: Y-up, lng=0 faces +Z
      // Same level as the dots (globe surface)
      const r = globeRadius + 1;
      const latRad = city.lat * Math.PI / 180;
      const lngRad = city.lng * Math.PI / 180;
      return new THREE.Vector3(
        r * Math.cos(latRad) * Math.sin(lngRad),
        r * Math.sin(latRad),
        r * Math.cos(latRad) * Math.cos(lngRad)
      );
    }

    function createArc() {
      if (arcs.length >= MAX_ARCS) return;

      const cityA = majorCities[Math.floor(Math.random() * majorCities.length)];
      let cityB = majorCities[Math.floor(Math.random() * majorCities.length)];
      while (cityB === cityA) cityB = majorCities[Math.floor(Math.random() * majorCities.length)];

      const start = cityToVec3(cityA);
      const end = cityToVec3(cityB);

      // Arc rises from endpoint positions to high midpoint — exaggerated height
      const dist = start.distanceTo(end);
      const arcHeight = 1.8 + (dist / (globeRadius * 2)) * 1.5;
      const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(globeRadius * arcHeight);

      // Cubic bezier with high control points for dramatic arc
      const ctrl1 = start.clone().lerp(mid, 0.4);
      const ctrl2 = end.clone().lerp(mid, 0.4);
      const curve = new THREE.CubicBezierCurve3(start, ctrl1, ctrl2, end);
      const points = curve.getPoints(64);

      // Line using BufferGeometry (setDrawRange works correctly on lines)
      const colorPair = arcColors[Math.floor(Math.random() * arcColors.length)];
      const lineColor = colorPair[0].clone().lerp(colorPair[1], 0.5);
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({
        color: lineColor,
        transparent: true,
        opacity: 1.0,
      });

      const line = new THREE.Line(geometry, material);
      globeContainer.add(line);

      // Endpoint bullseye markers (on the globe surface, flat)
      const glowStart = createEndpointMarker(colorPair[0]);
      const glowEnd = createEndpointMarker(colorPair[1]);
      glowStart.position.copy(start);
      glowEnd.position.copy(end);
      // Orient to face outward from globe center (lie flat on surface)
      glowStart.lookAt(start.clone().multiplyScalar(2));
      glowEnd.lookAt(end.clone().multiplyScalar(2));
      // Start endpoint visible immediately, end appears when line finishes drawing
      setMarkerOpacity(glowStart, 1.0);
      setMarkerOpacity(glowEnd, 0);
      globeContainer.add(glowStart);
      globeContainer.add(glowEnd);

      // Progressive draw setup
      const totalPoints = 65;
      line.geometry.setDrawRange(0, 0);

      arcs.push({
        line, glowStart, glowEnd,
        totalPoints,
        created: Date.now(),
        drawDuration: 600,  // fast draw (0.6s)
        holdDuration: 3000, // persist for 3s while others spawn
        fadeDuration: 800,  // fade out over 0.8s
      });
    }

    // Spawn a new arc every 1s (production timing), up to MAX_ARCS concurrent
    setTimeout(createArc, 500);
    setInterval(createArc, 1000);

    // --- Auto rotation only (no user interaction) ---
    const autoRotateSpeed = 0.001;

    // --- Reveal animation ---
    let revealProgress = 0;
    const revealDuration = 1500;
    const revealStart = Date.now();

    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

    // --- Animation loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Reveal (dots only)
      if (revealProgress < 1) {
        revealProgress = Math.min(1, (Date.now() - revealStart) / revealDuration);
      }

      // Update dot shader time
      dotUniforms.u_time.value = elapsed;

      // Rotate leftward (Americas → Europe → Asia)
      globeContainer.rotation.y -= autoRotateSpeed;

      // Update arcs — 3 phases: draw, hold, fade
      const now = Date.now();
      for (let i = arcs.length - 1; i >= 0; i--) {
        const arc = arcs[i];
        const age = now - arc.created;
        const totalLife = arc.drawDuration + arc.holdDuration + arc.fadeDuration;

        if (age > totalLife) {
          // Remove expired arc
          globeContainer.remove(arc.line);
          globeContainer.remove(arc.glowStart);
          globeContainer.remove(arc.glowEnd);
          arc.line.geometry.dispose();
          arc.line.material.dispose();
          arc.glowStart.userData.dotMat.dispose();
          arc.glowStart.userData.ringMat.dispose();
          arc.glowEnd.userData.dotMat.dispose();
          arc.glowEnd.userData.ringMat.dispose();
          arcs.splice(i, 1);
        } else if (age < arc.drawDuration) {
          // Phase 1: Drawing — line progressively extends
          const drawProgress = age / arc.drawDuration;
          const pointCount = Math.floor(drawProgress * arc.totalPoints);
          arc.line.geometry.setDrawRange(0, pointCount);
          arc.line.material.opacity = 1.0;
          setMarkerOpacity(arc.glowStart, 1.0);
          setMarkerOpacity(arc.glowEnd, drawProgress > 0.9 ? (drawProgress - 0.9) / 0.1 : 0);
        } else if (age < arc.drawDuration + arc.holdDuration) {
          // Phase 2: Hold — fully drawn, both endpoints visible
          arc.line.geometry.setDrawRange(0, arc.totalPoints);
          arc.line.material.opacity = 1.0;
          setMarkerOpacity(arc.glowStart, 1.0);
          setMarkerOpacity(arc.glowEnd, 1.0);
        } else {
          // Phase 3: Fade out
          const fadeAge = age - arc.drawDuration - arc.holdDuration;
          const fadeProgress = 1 - (fadeAge / arc.fadeDuration);
          arc.line.geometry.setDrawRange(0, arc.totalPoints);
          arc.line.material.opacity = fadeProgress;
          setMarkerOpacity(arc.glowStart, fadeProgress);
          setMarkerOpacity(arc.glowEnd, fadeProgress);
        }

      }

      renderer.render(scene, camera);
    }
    animate();

    // --- Resize ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.left = -w/2; camera.right = w/2;
      camera.top = h/2; camera.bottom = -h/2;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // --- Controls ---
    function updateColors() {
      Object.keys(config).forEach(k => { config[k] = document.getElementById(k).value; });
      globeMaterial.color.set(config.globeColor);
      ambientLightObj.color.set(config.ambientLight);
      backLightObj.color.set(config.backLight);
      frontLightObj.color.set(config.frontLight);
      renderer.setClearColor(new THREE.Color(config.background), 1);
      dotUniforms.u_color.value.set(config.dotColor);
    }

    document.querySelectorAll('#controls input[type="color"]').forEach(input => {
      input.addEventListener('input', updateColors);
    });

    function applyWhiteTheme() {
      const t = { globeColor:'#f1f5f5', dotColor:'#b3ccff', ambientLight:'#dde6ef', backLight:'#222222', frontLight:'#44444f', background:'#ffffff' };
      Object.keys(t).forEach(k => { document.getElementById(k).value = t[k]; });
      updateColors();
    }
    function applyDarkTheme() {
      const t = { globeColor:'#102038', dotColor:'#306ba6', ambientLight:'#99e6fc', backLight:'#c2f0fd', frontLight:'#a1a5af', background:'#092540' };
      Object.keys(t).forEach(k => { document.getElementById(k).value = t[k]; });
      updateColors();
    }
    function copyURL() {
      const p = new URLSearchParams();
      Object.keys(config).forEach(k => p.set(k, config[k].replace('#', '')));
      const url = window.location.origin + window.location.pathname + '?' + p.toString();
      navigator.clipboard.writeText(url).then(() => alert('URL copied!'));
    }
    function toggleControls() {
      const c = document.getElementById('controls');
      const b = document.getElementById('toggle-btn');
      if (c.style.display === 'none') { c.style.display = 'block'; b.style.display = 'none'; }
      else { c.style.display = 'none'; b.style.display = 'block'; }
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleControls(); });
  </script>
</body>
</html>
